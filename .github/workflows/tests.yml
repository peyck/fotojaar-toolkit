name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Vereisten installeren
        run: python -m pip install -r requirements.txt
      - name: Tests (jaartalbronnen, weekverdeling, talen, lokale server)
        run: python -m unittest discover tools/tests
      - name: Demo bouwen
        run: python tools/build.py demo
